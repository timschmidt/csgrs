[files]
extend-exclude = [".git", "stl/**", "crates/**"]

[default]
locale = "en"
# Abbreviated and full commit hashes cited by ledgers.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[default.extend-words]
# allow list / custom corrections
CSG = "CSG"
csg = "csg"
cgs = "CSG"
CGS = "CSG"

iy = "iy"
iz = "iz"
toi = "toi"
ein = "ein"
espace = "espace"
metalness = "metalness"
PN = "PN"

# Abbreviation for homogeneous coordinates
hom = "hom"
# Acronym for Level-of-Detail
LOD = "LOD"

# TrueType glyph location table tag
loca = "loca"
