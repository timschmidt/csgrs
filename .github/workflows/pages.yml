name: Deploy demos to GitHub Pages

# The repository has one Pages site, so the hypercurve, hypermesh and
# hypertri WASM demos are built together and published under
# <site>/hypercurve/, <site>/hypermesh/ and <site>/hypertri/.

on:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build WASM demos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRUNK_COLOR: never
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Cache Cargo build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            crates/hypercurve/examples/hypercurve_ui -> target
            crates/hypermesh/examples/hypermesh_ui -> target
            crates/hypertri/examples/hypertri_ui -> target

      - name: Install Trunk
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: trunk@0.21.14

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - name: Build hypercurve UI
        working-directory: crates/hypercurve/examples/hypercurve_ui
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: trunk build index.html --release --dist dist --public-url "${BASE_PATH}/hypercurve/"

      - name: Build hypermesh UI
        working-directory: crates/hypermesh/examples/hypermesh_ui
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: trunk build --release --locked --dist dist --public-url "${BASE_PATH}/hypermesh/"

      - name: Build hypertri UI
        working-directory: crates/hypertri/examples/hypertri_ui
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: trunk build --release --dist dist --public-url "${BASE_PATH}/hypertri/"

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r crates/hypercurve/examples/hypercurve_ui/dist site/hypercurve
          cp -r crates/hypermesh/examples/hypermesh_ui/dist site/hypermesh
          cp -r crates/hypertri/examples/hypertri_ui/dist site/hypertri
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>csgrs demos</title>
          <h1>csgrs demos</h1>
          <ul>
            <li><a href="hypercurve/">hypercurve</a></li>
            <li><a href="hypermesh/">hypermesh</a></li>
            <li><a href="hypertri/">hypertri</a></li>
          </ul>
          HTML
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # Required to publish the Pages artifact.
      id-token: write # Required for Pages OIDC authentication.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
