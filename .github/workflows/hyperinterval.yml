name: hyperinterval

on:
  push:
    branches: ["**"]
    paths:
      - "crates/hyperinterval/**"
      - "scripts/check_interval_float_codegen.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hyperinterval.yml"
  pull_request:
    paths:
      - "crates/hyperinterval/**"
      - "scripts/check_interval_float_codegen.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hyperinterval.yml"
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Core (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.88.0", "1.95.0", stable]
    env:
      INTERVAL_RUST: ${{ matrix.rust }}
      INTERVAL_FEATURES: ${{ matrix.rust == '1.88.0' && 'integer,fixed,dyadic,float-proposal,float-enclosure,serde' || 'integer,fixed,real-ball,float-proposal,float-enclosure,serde,dispatch-trace' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install "$INTERVAL_RUST" --profile minimal --component clippy --component rustfmt
      - name: Check feature isolation and laws
        run: |
          for features in '' integer fixed integer,fixed serde integer,serde fixed,serde alloc std bigint dyadic dyadic,serde float-proposal float-proposal,serde float-enclosure float-enclosure,serde float-enclosure,dyadic; do
            cargo +"$INTERVAL_RUST" test --locked -p hyperinterval --no-default-features --features "$features"
          done
          if [ "$INTERVAL_RUST" != 1.88.0 ]; then
            for features in rational rational,serde rational,dyadic hyperreal real-ball float-enclosure,rational; do
              cargo +"$INTERVAL_RUST" test --locked -p hyperinterval --no-default-features --features "$features"
            done
          fi
          cargo +"$INTERVAL_RUST" test --locked -p hyperinterval --all-targets --features "$INTERVAL_FEATURES"
          cargo +"$INTERVAL_RUST" test --locked -p hyperinterval --doc --features "$INTERVAL_FEATURES"
          cargo +"$INTERVAL_RUST" test --locked -p hyperinterval --release --features "$INTERVAL_FEATURES" --test float alternate_native_modes -- --nocapture
      - name: Check formatting and lint
        run: |
          cargo +"$INTERVAL_RUST" fmt -p hyperinterval -- --check
          cargo +"$INTERVAL_RUST" clippy --locked -p hyperinterval --all-targets --features "$INTERVAL_FEATURES" -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +"$INTERVAL_RUST" doc --locked -p hyperinterval --no-deps --features "$INTERVAL_FEATURES"
      - name: Inspect strict float release code
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/check_interval_float_codegen.py --toolchain "$INTERVAL_RUST" --output "$RUNNER_TEMP/interval-float-codegen"
      - name: Verify firmware dependency closure
        run: |
          cargo +"$INTERVAL_RUST" tree --locked -p hyperinterval --no-default-features --features integer,fixed --edges normal --prefix none > interval-dependencies.txt
          test "$(wc -l < interval-dependencies.txt)" -eq 1
          cargo +"$INTERVAL_RUST" tree --locked -p hyperinterval --no-default-features --features float-proposal --edges normal --prefix none > proposal-dependencies.txt
          test "$(wc -l < proposal-dependencies.txt)" -eq 1
          cargo +"$INTERVAL_RUST" tree --locked -p hyperinterval --no-default-features --features float-enclosure --edges normal --prefix none > float-dependencies.txt
          test "$(wc -l < float-dependencies.txt)" -eq 1
      - name: Check fuzz harness
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: |
          cargo check --locked --manifest-path crates/hyperinterval/fuzz/Cargo.toml --bins
          cargo check --locked --manifest-path crates/hyperinterval/fuzz/Cargo.toml --bins --features rational
          rustfmt --edition 2024 --check crates/hyperinterval/fuzz/fuzz_targets/*.rs

  portable:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, thumbv7em-none-eabihf]
    env:
      INTERVAL_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum compiler and target
        run: rustup toolchain install 1.88.0 --profile minimal --target "$INTERVAL_TARGET"
      - name: Build primitive and allocation-enabled no_std subsets
        run: |
          cargo +1.88.0 check --locked -p hyperinterval --target "$INTERVAL_TARGET" --no-default-features
          cargo +1.88.0 check --locked -p hyperinterval --target "$INTERVAL_TARGET" --no-default-features --features integer,fixed
          cargo +1.88.0 check --locked -p hyperinterval --target "$INTERVAL_TARGET" --no-default-features --features integer,fixed,serde
          cargo +1.88.0 check --locked -p hyperinterval --target "$INTERVAL_TARGET" --no-default-features --features dyadic,serde
          cargo +1.88.0 check --locked -p hyperinterval --target "$INTERVAL_TARGET" --no-default-features --features float-proposal,serde
          cargo +1.88.0 check --locked -p hyperinterval --target "$INTERVAL_TARGET" --no-default-features --features float-enclosure,serde

  sanitizer:
    name: Bounded ASan interval campaigns
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/hyperinterval
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install sanitizer toolchain and driver
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run constructor and arithmetic campaigns
        run: |
          mkdir -p "$RUNNER_TEMP/interval-constructors" "$RUNNER_TEMP/interval-arithmetic" "$RUNNER_TEMP/interval-dyadic" "$RUNNER_TEMP/interval-proposals" "$RUNNER_TEMP/interval-strict-float"
          mkdir -p "$RUNNER_TEMP/interval-rational-powers" "$RUNNER_TEMP/interval-square-roots" "$RUNNER_TEMP/interval-primitive-roots"
          cargo +nightly fuzz run constructors "$RUNNER_TEMP/interval-constructors" -- -runs=10000 -max_len=1024 -max_total_time=30 -seed=20261112
          cargo +nightly fuzz run fixed_arithmetic "$RUNNER_TEMP/interval-arithmetic" -- -runs=100000 -max_len=16 -max_total_time=30 -seed=20261112
          cargo +nightly fuzz run dyadic_arithmetic "$RUNNER_TEMP/interval-dyadic" -- -runs=100000 -max_len=14 -max_total_time=30 -seed=20261112
          cargo +nightly fuzz run primitive_proposals "$RUNNER_TEMP/interval-proposals" -- -runs=100000 -max_len=32 -max_total_time=30 -seed=20261113
          cargo +nightly fuzz run strict_float "$RUNNER_TEMP/interval-strict-float" -- -runs=100000 -max_len=24 -max_total_time=30 -seed=20261114
          cargo +nightly fuzz run rational_powers --features rational "$RUNNER_TEMP/interval-rational-powers" -- -runs=100000 -max_len=10 -max_total_time=30 -seed=20261115
          cargo +nightly fuzz run square_roots --features rational "$RUNNER_TEMP/interval-square-roots" -- -runs=100000 -max_len=10 -max_total_time=30 -seed=20261116
          cargo +nightly fuzz run primitive_roots "$RUNNER_TEMP/interval-primitive-roots" -- -runs=100000 -max_len=16 -max_total_time=30 -seed=20261117
