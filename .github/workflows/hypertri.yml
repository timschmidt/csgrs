name: hypertri

on:
  push:
    branches: ["**"]
    paths:
      - "crates/hypertri/**"
      - "crates/hyperlattice/**"
      - "crates/hyperlimit/**"
      - "crates/hyperreal/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hypertri.yml"
  pull_request:
    paths:
      - "crates/hypertri/**"
      - "crates/hyperlattice/**"
      - "crates/hyperlimit/**"
      - "crates/hyperreal/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hypertri.yml"
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crates/hypertri

jobs:
  feature-powerset:
    name: Feature powerset / ${{ matrix.kind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: check
            command: cargo hack check --feature-powerset --exclude-features all-algorithms --all-targets
          - kind: test
            command: cargo hack test --feature-powerset --exclude-features all-algorithms

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@e5307749adff22649743d264eea18999b2666e85 # cargo-hack

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.kind }}

      - name: Run ${{ matrix.kind }} across feature powerset
        env:
          COMMAND: ${{ matrix.command }}
        run: $COMMAND

  aggregate-configs:
    name: Aggregate and dependent configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            crates/hypertri/examples/hypertri_ui -> target

      - name: Test all-algorithms alias
        run: cargo test --no-default-features --features all-algorithms

      - name: Test all features
        run: cargo test --all-features

      - name: Test every Real representation and cache layout
        run: scripts/representation_coverage.sh

      - name: Compile sanitizer fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

      - name: Build docs with all features
        run: cargo doc --no-deps --all-features

      - name: Check UI feature selection
        run: cargo check --manifest-path examples/hypertri_ui/Cargo.toml

  coverage:
    name: Production line coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust with coverage tools
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/hypertri -> target/coverage

      - name: Enforce production coverage threshold
        run: scripts/coverage.sh
