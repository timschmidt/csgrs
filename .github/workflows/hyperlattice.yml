name: hyperlattice

on:
  push:
    branches: ["**"]
    paths:
      - "crates/hyperlattice/**"
      - "crates/hyperreal/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hyperlattice.yml"
  pull_request:
    paths:
      - "crates/hyperlattice/**"
      - "crates/hyperreal/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hyperlattice.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crates/hyperlattice

jobs:
  checks:
    name: Rust checks (${{ matrix.backend.name }})
    runs-on: ubuntu-latest
    env:
      CARGO_ARGS: ${{ matrix.backend.args }}
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: default
            args: ""
          - name: all-features
            args: "--all-features"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.backend.name }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Check build
        run: cargo check --locked --all-targets ${CARGO_ARGS}

      - name: Run tests
        run: cargo test --locked --all-targets ${CARGO_ARGS}

      - name: Run Clippy
        run: cargo clippy --locked --all-targets ${CARGO_ARGS} -- -D warnings

      - name: Check fuzz targets
        if: matrix.backend.name == 'default'
        run: cargo check --manifest-path fuzz/Cargo.toml --bins
