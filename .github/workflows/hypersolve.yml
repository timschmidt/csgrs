name: hypersolve

on:
  push:
    branches: ["**"]
    paths:
      - "crates/hypersolve/**"
      - "crates/hyperinterval/**"
      - "crates/hyperlattice-interval/conformance/run-wasi-test.mjs"
      - "crates/hyperlattice/**"
      - "crates/hyperlimit/**"
      - "crates/hyperreal/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hypersolve.yml"
  pull_request:
    paths:
      - "crates/hypersolve/**"
      - "crates/hyperinterval/**"
      - "crates/hyperlattice-interval/conformance/run-wasi-test.mjs"
      - "crates/hyperlattice/**"
      - "crates/hyperlimit/**"
      - "crates/hyperreal/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hypersolve.yml"
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HYPERSOLVE_SKIP_BENCHMARK_REPORTS: "1"

defaults:
  run:
    working-directory: crates/hypersolve

jobs:
  wasi-interval:
    name: Solver tests and replay (WASI Preview 1, Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.95.0", stable]
    env:
      HYPERSOLVE_RUST: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - name: Run solver tests, source replays and isolated dispatch comparisons
        run: |
          rustup toolchain install "$HYPERSOLVE_RUST" --profile minimal --target wasm32-wasip1
          python3 ../hyperinterval/conformance/wasi-solver.py --toolchain "$HYPERSOLVE_RUST" --output "$RUNNER_TEMP/horner-wasi"

  quality:
    name: Tests, representations, fuzz build, lint, and docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: |
          cargo fmt -- --check
          rustfmt --edition 2024 --check fuzz/fuzz_targets/hyperreal_representations.rs

      - name: Check every target
        run: cargo check --locked --all-targets --all-features

      - name: Test without features
        run: cargo test --locked --no-default-features

      - name: Run the coupled Krawczyk certificate example
        run: cargo run --locked --no-default-features --example krawczyk_certificate

      - name: Test all targets and features
        run: cargo test --locked --all-targets --all-features

      - name: Test every Real representation and cache layout
        run: scripts/representation_coverage.sh

      - name: Check steady-state allocation lifetimes
        env:
          HYPERSOLVE_ALLOCATION_ITERATIONS: "4"
        run: scripts/allocation_profile.sh

      - name: Compile sanitizer fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins

      - name: Lint the Real-representation fuzz target
        run: >-
          cargo clippy --locked --manifest-path fuzz/Cargo.toml
          --bin hyperreal_representations -- -D warnings

      - name: Fuzz Krawczyk certificates against factored roots
        env:
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
          corpus="$RUNNER_TEMP/krawczyk-certificates"
          mkdir -p "$corpus"
          cp tests/fixtures/krawczyk/*.bin "$corpus/"
          cargo clippy --locked --manifest-path ../hyperinterval/fuzz/Cargo.toml --features solver-certificates --bin krawczyk_certificates -- -D warnings
          cargo +nightly fuzz run krawczyk_certificates "$corpus" --fuzz-dir ../hyperinterval/fuzz --features solver-certificates -- -runs=10000 -max_len=8 -max_total_time=90 -seed=20261119

      - name: Fuzz quadratic box certificates against exact extrema
        env:
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib
        run: |
          corpus="$RUNNER_TEMP/conic-box-certificates"
          mkdir -p "$corpus"
          cp tests/fixtures/conic/*.bin "$corpus/"
          cargo clippy --locked --manifest-path ../hyperinterval/fuzz/Cargo.toml --features solver-certificates --bin conic_box_certificates -- -D warnings
          cargo +nightly fuzz run conic_box_certificates "$corpus" --fuzz-dir ../hyperinterval/fuzz --features solver-certificates -- -runs=10000 -max_len=11 -max_total_time=90 -seed=20261119

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

  coverage:
    name: Production line coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust with LLVM coverage tools
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/hypersolve -> target/coverage

      - name: Enforce production coverage threshold
        run: scripts/coverage.sh
