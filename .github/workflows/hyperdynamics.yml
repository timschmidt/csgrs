name: hyperdynamics

on:
  push:
    paths:
      - "crates/hyperdynamics/**"
      - "crates/hypersolve/**"
      - "crates/hyperlattice/**"
      - "crates/hyperlattice-interval/**"
      - "crates/hyperinterval/**"
      - "crates/hyperlimit/**"
      - "crates/hyperreal/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hyperdynamics.yml"
  pull_request:
    paths:
      - "crates/hyperdynamics/**"
      - "crates/hypersolve/**"
      - "crates/hyperlattice/**"
      - "crates/hyperlattice-interval/**"
      - "crates/hyperinterval/**"
      - "crates/hyperlimit/**"
      - "crates/hyperreal/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hyperdynamics.yml"
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  wasi:
    name: Numerical suites and fresh replays (WASI Preview 1, Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.95.0", stable]
    env:
      DYNAMICS_RUST: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - name: Run direct guest tests and replay native sources in fresh guests
        run: |
          rustup toolchain install "$DYNAMICS_RUST" --profile minimal --target wasm32-wasip1
          python3 crates/hyperinterval/conformance/wasi-dynamics.py --toolchain "$DYNAMICS_RUST" --output "$RUNNER_TEMP/dynamics-wasi"

  quality:
    name: Feature and runtime checks (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.95.0", "stable"]
    env:
      DYNAMICS_RUST: ${{ matrix.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and feature driver
        run: |
          rustup toolchain install "$DYNAMICS_RUST" --profile minimal --component clippy --component rustfmt
          cargo +"$DYNAMICS_RUST" install cargo-hack --version 0.6.46 --locked
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: dynamics-${{ matrix.rust }}
      - name: Check formatting
        run: |
          cargo +"$DYNAMICS_RUST" fmt -p hyperdynamics -- --check
          rustfmt +"$DYNAMICS_RUST" --edition 2024 --check crates/hyperdynamics/fuzz/fuzz_targets/*.rs
      - name: Check every feature independently
        run: cargo +"$DYNAMICS_RUST" hack check --locked -p hyperdynamics --each-feature --all-targets
      - name: Test without optional features
        run: cargo +"$DYNAMICS_RUST" test --locked -p hyperdynamics --no-default-features
      - name: Test all targets and features
        run: cargo +"$DYNAMICS_RUST" test --locked -p hyperdynamics --all-targets --all-features
      - name: Test optimized library and integration suites
        run: cargo +"$DYNAMICS_RUST" test --locked -p hyperdynamics --release --lib --tests --all-features
      - name: Test documentation
        run: cargo +"$DYNAMICS_RUST" test --locked -p hyperdynamics --doc --all-features
      - name: Lint both feature boundaries
        run: |
          cargo +"$DYNAMICS_RUST" clippy --locked -p hyperdynamics --all-targets --no-default-features -- -D warnings
          cargo +"$DYNAMICS_RUST" clippy --locked -p hyperdynamics --all-targets --all-features -- -D warnings
      - name: Compile and lint fuzz targets
        run: |
          cargo +"$DYNAMICS_RUST" check --locked --manifest-path crates/hyperdynamics/fuzz/Cargo.toml --bins
          cargo +"$DYNAMICS_RUST" clippy --locked --manifest-path crates/hyperdynamics/fuzz/Cargo.toml --bins -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +"$DYNAMICS_RUST" doc --locked -p hyperdynamics --no-deps --all-features
      - name: Fuzz reachability step and subdivision policies
        if: matrix.rust == 'stable'
        working-directory: crates/hyperdynamics
        env:
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
          corpus="$RUNNER_TEMP/reachability-policy"
          mkdir -p "$corpus"
          printf '\374\005\003\001\005\376\006\004' > "$corpus/spatial"
          printf '\372\001\001\002\002\376\002\201' > "$corpus/temporal"
          cargo +nightly fuzz run reachability_policy "$corpus" -- -runs=10000 -max_len=8 -max_total_time=60 -seed=20261118
