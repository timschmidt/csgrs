name: Workspace

# Builds every crate in the workspace together, and tests the crates that
# have no workflow of their own. Crates with their own workflow (csgrs,
# csgrs-ffi, hyperreal, hyperlattice, hypersolve, hypertri, hypermesh,
# hypercurve, hypergraphics, hyperspatial, hyperinterval, hyperdynamics) are
# tested there. The hyperlattice workflow also tests hyperlattice-interval.

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check every member and target
        run: cargo check --locked --workspace --all-targets

  test:
    name: Test ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 30 }}
    strategy:
      fail-fast: false
      matrix:
        crate:
          - hyperlimit
          - hyperpack
          - hyperevolution
          - hyperbrep
          - hyperbrep-io
          - hypersdf
          - hyperparts
          - hypercircuit
          - hyperpath
          - hyperphysics
        include:
          # The exact BREP corpus takes about 30 minutes in a debug build;
          # keep debug assertions and give it room instead of using release.
          - crate: hyperbrep
            timeout: 90
          # The complex-project performance tests take over 40 minutes in a
          # debug build and about 35 in release.
          - crate: hyperdrc
            args: --release
            timeout: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.crate }}
      - name: Run tests
        env:
          CRATE: ${{ matrix.crate }}
          ARGS: ${{ matrix.args }}
          HYPERDRC_REQUIRE_COMPLEX_FIXTURES: "1"
        run: cargo test --locked -p "${CRATE}" ${ARGS}
      - name: Replay the lookahead schedule example
        if: matrix.crate == 'hyperpath'
        run: cargo run --locked -p hyperpath --example certified_schedule

  hyperpath-wasi:
    name: Hyperpath tests and schedule replay (WASI Preview 1, Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.95.0", stable]
    env:
      HYPERPATH_RUST: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - name: Run the path suites and compare the shipped schedule
        run: |
          rustup toolchain install "$HYPERPATH_RUST" --profile minimal --target wasm32-wasip1
          python3 crates/hyperinterval/conformance/wasi-path.py --toolchain "$HYPERPATH_RUST" --output "$RUNNER_TEMP/path-wasi"

  hypervoxel:
    name: hypervoxel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/hypervoxel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/hypervoxel -> target
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --locked
