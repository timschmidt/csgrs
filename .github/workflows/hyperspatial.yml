name: hyperspatial

on:
  push:
    branches: ["**"]
    paths:
      - "crates/hyperspatial/**"
      - "crates/hyperreal/**"
      - "crates/hyperlattice/**"
      - "crates/hyperlimit/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hyperspatial.yml"
  pull_request:
    paths:
      - "crates/hyperspatial/**"
      - "crates/hyperreal/**"
      - "crates/hyperlattice/**"
      - "crates/hyperlimit/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hyperspatial.yml"
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Native checks (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, 1.95.0]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: hyperspatial-${{ matrix.toolchain }}
      - name: Run native checks and source consumer
        run: bash crates/hyperspatial/scripts/checks.sh
      - name: Run optimized workflow probes
        run: cargo bench --locked -p hyperspatial --benches

  representations:
    name: Scalar representations and caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Exercise scalar configurations
        env:
          RUSTUP_TOOLCHAIN: stable
        run: bash crates/hyperspatial/scripts/representation-checks.sh

  directed:
    name: Directed cases and ASan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and fuzz driver
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal
          cargo +stable install --locked cargo-fuzz --version 0.13.2
      - name: Select costly valid cases in independent representation buckets
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python3 crates/hyperspatial/scripts/directed.py
      - name: Select projection cases in independent representation buckets
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python3 crates/hyperspatial/scripts/directed.py --workload mercator --output target/hyperspatial-directed-mercator
      - name: Mutate and replay with address sanitizer
        run: python3 crates/hyperspatial/scripts/fuzz-smoke.py --selected-corpus target/hyperspatial-directed/corpus --mercator-corpus target/hyperspatial-directed-mercator/corpus
      - name: Retain campaign evidence and failure inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyperspatial-directed-evidence
          path: |
            target/hyperspatial-directed/
            target/hyperspatial-directed-mercator/
            target/hyperspatial-asan/
            crates/hyperspatial/fuzz/artifacts/
          retention-days: 30

  wasm:
    name: WASM library build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and WASM target
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
      - name: Check native library on WASM
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo check --locked -p hyperspatial --lib --all-features --target wasm32-unknown-unknown
      - name: Lint native library on WASM
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo clippy --locked -p hyperspatial --lib --all-features --target wasm32-unknown-unknown -- -D warnings

  coverage:
    name: Production coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and LLVM tools
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - name: Measure production coverage
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python3 crates/hyperspatial/scripts/coverage.py
