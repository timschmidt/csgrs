[package]
name = "hyperreal"
description = "Exact rational and computable real arithmetic in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/timschmidt/csgrs"
documentation = "https://docs.rs/hyperreal"
version = "0.13.1"
edition = "2024"
rust-version = "1.95.0"
readme = "README.md"
include = ["/src/**", "/tests/support/**", "/README.md", "/LICENSE*"]
keywords = ["real", "rational", "arithmetic", "exact", "math"]
categories = ["mathematics", "science", "data-structures"]

[features]
default = []
simple = []
cached-f32-approx = []
cached-f64-approx = []
# Compile-time opt-in diagnostic hooks for benchmark path tracing. The
# instrumentation macro compiles away unless this feature is enabled.
dispatch-trace = []
serde = ["dep:serde", "dep:serde_json", "dep:ciborium", "num/serde"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }

[dependencies]
ciborium = { version = "0.2.2", optional = true }
num = { version = "0.4.3", features = ["num-bigint"] }
serde = { version = "1.0.228", features = ["derive", "rc"], optional = true }
serde_json = { version = "1.0.149", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.7.0"
# Competitive GMP/MPFR benchmarks and test oracles only. Hyperreal's release
# graph and arithmetic implementation must remain independent of GMP.
rug = { version = "1.30.0", default-features = false, features = ["float", "rational", "std"] }
serde_json = "1.0.149"
toml = "=0.8.23"

[[bin]]
name = "hyperreal"
path = "src/main.rs"
required-features = ["simple"]

[[example]]
name = "readme_quickstart"

[[example]]
name = "directed_scalar_bench"
required-features = ["serde"]

[[example]]
name = "directed_scalar_probe"
required-features = ["serde", "dispatch-trace"]

[[bench]]
name = "borrowed_ops"
harness = false

[[bench]]
name = "elliptic_integrals"
harness = false

[[bench]]
name = "inverse_legendre"
harness = false

[[bench]]
name = "jacobi"
harness = false

[[bench]]
name = "legendre_integrals"
harness = false

[[bench]]
name = "dispatch_trace"
harness = false
required-features = ["dispatch-trace"]

[[bench]]
name = "library_perf"
harness = false
required-features = ["simple"]

[[bench]]
name = "numerical_micro"
harness = false

[[bench]]
name = "float_convert"
harness = false

[[bench]]
name = "scalar_micro"
harness = false

[[bench]]
name = "gmp_api"
harness = false

[[bench]]
name = "adversarial_transcendentals"
harness = false

[[bench]]
name = "adversarial_library"
harness = false

[[bench]]
name = "real_representations"
harness = false

[[bench]]
name = "bounded_parameter_encodings"
harness = false
required-features = ["serde"]
