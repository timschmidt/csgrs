name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verus:
    name: Verus proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Verus
        run: python3 scripts/verify_verus.py install

      - name: Verify production kernels and rational semantics
        run: python3 scripts/verify_verus.py verify

      - name: Check rejection of incorrect implementations
        run: python3 verification/test_rejections.py

      - name: Check baseline acceptance evidence guards
        run: python3 verification/test_acceptance.py

  checks:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check build
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins
