[package]
name = "centered-interval-wasm"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]

[lib]
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
hyperlattice-interval = { path = "../..", default-features = false, features = ["fixed", "float-enclosure"] }

[profile.release]
panic = "abort"
overflow-checks = true
