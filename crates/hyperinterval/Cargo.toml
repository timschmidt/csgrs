[package]
name = "hyperinterval"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Explicit scalar sets and checked interval enclosures for the Hyper stack"
license = "MIT OR Apache-2.0"
repository = "https://github.com/timschmidt/csgrs"
documentation = "https://docs.rs/hyperinterval"
readme = "README.md"
include = ["/src/**", "/examples/*.rs", "/README.md", "/CHANGELOG.md", "/LICENSE*"]
categories = ["mathematics", "no-std", "embedded"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
alloc = []
std = ["alloc"]
integer = []
fixed = []
float-proposal = []
float-enclosure = []
float-enclosure-wasip1 = ["float-enclosure", "dep:target-tuple"]
bigint = ["alloc", "dep:num-bigint", "dep:num-traits", "dep:num-integer"]
dyadic = ["bigint"]
rational = ["std", "dep:hyperreal"]
hyperreal = ["rational", "dyadic"]
real-ball = ["hyperreal"]
serde = ["dep:serde", "hyperreal?/serde", "num-bigint?/serde"]
dispatch-trace = ["hyperreal?/dispatch-trace"]

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
target-tuple = { version = "1", optional = true }

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
hyperreal = { version = "0.14.0", path = "../hyperreal", default-features = false, optional = true }
num-bigint = { version = "0.4.6", default-features = false, optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }
num-integer = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1.0"

# Unix and WASI Preview 1 run the directed MPFR oracles. MSVC runs the
# portable exact-integer and dispatch tests.
[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
rug = { version = "1.30.0", default-features = false, features = ["float", "rational", "std"] }

# The Preview 1 test runner supplies a WASI C compiler for the Rug oracles.
[target.wasm32-wasip1.dev-dependencies]
gmp-mpfr-sys = { version = "1.7", default-features = false, features = ["force-cross"] }

[[example]]
name = "real_to_dyadic"
required-features = ["hyperreal"]

[[example]]
name = "proposal_replay"
required-features = ["rational", "float-proposal"]

[[example]]
name = "fixed_bounds"
required-features = ["fixed"]

[[example]]
name = "host_cost"
path = "conformance/host_cost.rs"
required-features = ["hyperreal"]

[[example]]
name = "proposal_cost"
path = "conformance/proposal_cost.rs"
required-features = ["float-proposal"]

[[example]]
name = "rational_power_cost"
path = "conformance/rational_power_cost.rs"
required-features = ["rational"]

[[example]]
name = "order_cost"
path = "conformance/order_cost.rs"
required-features = ["integer", "fixed", "rational", "dyadic", "float-enclosure"]

[[example]]
name = "float_cost"
path = "conformance/float_cost.rs"
required-features = ["float-enclosure"]

[[example]]
name = "sqrt_cost"
path = "conformance/sqrt_cost.rs"
required-features = ["rational", "dyadic"]

[[example]]
name = "primitive_root_cost"
path = "conformance/primitive_root_cost.rs"
required-features = ["fixed", "float-enclosure"]

[[example]]
name = "exp_cost"
path = "conformance/exp_cost.rs"
required-features = ["rational", "dyadic"]

[[example]]
name = "log_cost"
path = "conformance/log_cost.rs"
required-features = ["rational", "dyadic"]

[[example]]
name = "atan_cost"
path = "conformance/atan_cost.rs"
required-features = ["rational", "dyadic"]

[[example]]
name = "trig_cost"
path = "conformance/trig_cost.rs"
required-features = ["rational", "dyadic"]

[[example]]
name = "division_cost"
path = "conformance/division_cost.rs"
required-features = ["dyadic"]

[[example]]
name = "fractional_power_cost"
path = "conformance/fractional_power_cost.rs"
required-features = ["dyadic"]

[[example]]
name = "tangent_cost"
path = "conformance/tangent_cost.rs"
required-features = ["dyadic", "rational"]
