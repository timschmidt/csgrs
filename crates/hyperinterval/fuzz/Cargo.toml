[package]
name = "hyperinterval-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.88"

[package.metadata]
cargo-fuzz = true

[features]
rational = ["hyperinterval/rational", "dep:hyperreal"]

[dependencies]
libfuzzer-sys = "0.4"
hyperinterval = { path = "..", features = ["integer", "fixed", "dyadic", "float-proposal", "float-enclosure", "serde"] }
serde_json = "1.0"
rug = { version = "1.30.0", default-features = false, features = ["float", "rational", "std"] }
hyperreal = { path = "../../hyperreal", default-features = false, optional = true }

[[bin]]
name = "constructors"
path = "fuzz_targets/constructors.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fixed_arithmetic"
path = "fuzz_targets/fixed_arithmetic.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "dyadic_arithmetic"
path = "fuzz_targets/dyadic_arithmetic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "primitive_proposals"
path = "fuzz_targets/primitive_proposals.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rational_powers"
path = "fuzz_targets/rational_powers.rs"
required-features = ["rational"]
test = false
doc = false
bench = false

[[bin]]
name = "strict_float"
path = "fuzz_targets/strict_float.rs"
test = false
doc = false
bench = false

[[bin]]
name = "square_roots"
path = "fuzz_targets/square_roots.rs"
required-features = ["rational"]
test = false
doc = false
bench = false

[[bin]]
name = "primitive_roots"
path = "fuzz_targets/primitive_roots.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exponential"
path = "fuzz_targets/exponential.rs"
required-features = ["rational"]
test = false
doc = false
bench = false
