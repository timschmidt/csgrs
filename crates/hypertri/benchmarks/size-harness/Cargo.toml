[package]
name = "hypertri-size-harness"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
hypertri = { path = "../..", default-features = false }

[features]
default = []
earcut = ["hypertri/earcut"]
cdt = ["hypertri/cdt"]
nd = ["hypertri/nd"]
all = ["earcut", "cdt", "nd", "hypertri/runtime-select"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.size]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = "symbols"
