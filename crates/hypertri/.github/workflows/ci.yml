name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  feature-powerset:
    name: Feature powerset / ${{ matrix.kind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: check
            command: cargo hack check --feature-powerset --exclude-features all-algorithms --all-targets
          - kind: test
            command: cargo hack test --feature-powerset --exclude-features all-algorithms

    steps:
      - name: Checkout hypertri
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: hypertri
          persist-credentials: false

      - name: Checkout hyperreal sibling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/hyperreal
          path: hyperreal
          persist-credentials: false

      - name: Checkout hyperlimit sibling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/hyperlimit
          path: hyperlimit
          persist-credentials: false

      - name: Checkout earcutr sibling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/earcutr
          path: earcutr
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@e5307749adff22649743d264eea18999b2666e85 # cargo-hack

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hypertri

      - name: Run ${{ matrix.kind }} across feature powerset
        working-directory: hypertri
        env:
          COMMAND: ${{ matrix.command }}
        run: $COMMAND

  aggregate-configs:
    name: Aggregate and dependent configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hypertri
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: hypertri
          persist-credentials: false

      - name: Checkout hyperreal sibling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/hyperreal
          path: hyperreal
          persist-credentials: false

      - name: Checkout hyperlimit sibling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/hyperlimit
          path: hyperlimit
          persist-credentials: false

      - name: Checkout earcutr sibling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/earcutr
          path: earcutr
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hypertri

      - name: Test all-algorithms alias
        working-directory: hypertri
        run: cargo test --no-default-features --features all-algorithms

      - name: Test all features
        working-directory: hypertri
        run: cargo test --all-features

      - name: Build docs with all features
        working-directory: hypertri
        run: cargo doc --no-deps --all-features

      - name: Check UI feature selection
        working-directory: hypertri
        run: cargo check --manifest-path examples/hypertri_ui/Cargo.toml
