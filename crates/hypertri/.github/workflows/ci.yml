name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  feature-powerset:
    name: Feature powerset / ${{ matrix.kind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: check
            command: cargo hack check --feature-powerset --exclude-features all-algorithms --all-targets
          - kind: test
            command: cargo hack test --feature-powerset --exclude-features all-algorithms

    steps:
      - name: Checkout hypertri
        uses: actions/checkout@v4
        with:
          path: hypertri

      - name: Checkout hyperreal sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hyperreal
          path: hyperreal

      - name: Checkout hyperlimit sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hyperlimit
          path: hyperlimit

      - name: Checkout earcutr sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/earcutr
          path: earcutr

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hypertri

      - name: Run ${{ matrix.kind }} across feature powerset
        working-directory: hypertri
        run: ${{ matrix.command }}

  aggregate-configs:
    name: Aggregate and dependent configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hypertri
        uses: actions/checkout@v4
        with:
          path: hypertri

      - name: Checkout hyperreal sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hyperreal
          path: hyperreal

      - name: Checkout hyperlimit sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hyperlimit
          path: hyperlimit

      - name: Checkout earcutr sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/earcutr
          path: earcutr

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hypertri

      - name: Test all-algorithms alias
        working-directory: hypertri
        run: cargo test --no-default-features --features all-algorithms

      - name: Test all features
        working-directory: hypertri
        run: cargo test --all-features

      - name: Build docs with all features
        working-directory: hypertri
        run: cargo doc --no-deps --all-features

      - name: Check UI feature selection
        working-directory: hypertri
        run: cargo check --manifest-path examples/hypertri_ui/Cargo.toml
