name: Deploy hypertri UI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: hypertri

      - name: Checkout hyperreal sibling
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/hyperreal
          path: hyperreal

      - name: Checkout hyperlimit sibling
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/hyperlimit
          path: hyperlimit

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hypertri/examples/hypertri_ui

      - name: Install Trunk
        uses: taiki-e/install-action@trunk

      - name: Build
        working-directory: hypertri/examples/hypertri_ui
        run: trunk build --release --public-url /hypertri/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hypertri/examples/hypertri_ui/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
