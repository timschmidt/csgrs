[package]
name = "hypertri"
version = "0.2.0"
edition = "2024"
description = "Hyperreal-backed triangulation algorithms with exact geometric predicates"
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/timschmidt/hypertri"
readme = "README.md"
keywords = ["triangulation", "geometry", "hyperreal", "predicates"]
categories = ["mathematics", "graphics", "algorithms"]

[features]
default = []
all-algorithms = ["earcut", "cdt", "nd"]
earcut = []
cdt = []
nd = []
runtime-select = []
f64-interop = []
serde = ["dep:serde"]

[dependencies]
# Hyper ecosystem dependencies: keep the crate-official release references and
# the commented workspace references below. Switch to the workspace form for
# local development, then switch back to crates.io versions before publishing.
hyperreal = { version = "0.12.0" }
hyperlimit = { path = "../hyperlimit", default-features = false, features = ["std"] }
# hyperreal = { path = "../hyperreal" }
# hyperlimit = { path = "../hyperlimit", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Dev-only differential oracle for ordinary polygon cases. Production code owns
# its exact ear-clipping port and must not build or link `earcutr`.
earcutr = "0.5.0"
proptest = "1.7.0"
serde_json = "1.0.149"

[[bench]]
name = "earcut"
harness = false
required-features = ["earcut", "f64-interop"]

[[bench]]
name = "delaunay"
harness = false
required-features = ["cdt", "f64-interop"]

[[bench]]
name = "exact"
harness = false
required-features = ["earcut", "cdt", "nd"]
