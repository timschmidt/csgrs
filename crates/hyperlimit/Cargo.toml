[package]
name = "hyperlimit"
autobenches = false
version = "0.5.0"
edition = "2024"
rust-version = "1.95.0"
description = "Hyperreal-backed exact predicates with structural Real awareness."
license = "MIT OR Apache-2.0"
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
repository = "https://github.com/timschmidt/csgrs"
documentation = "https://docs.rs/hyperlimit"
readme = "README.md"
include = ["/src/**", "/README.md", "/LICENSE*"]
keywords = ["exact", "geometric", "predicates", "boundary", "orientation"]
categories = ["mathematics", "games", "simulation"]

[dependencies]
hyperreal = { version = "0.14.0", path = "../hyperreal" }
hyperlattice = { version = "0.7.0", path = "../hyperlattice" }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
apfp = "0.1.1"
criterion = "0.5"
geometry-predicates = "0.3.0"
proptest = "1.7.0"
robust = "1.2.0"
serde_json = "1"

[features]
default = ["std"]
std = []
dispatch-trace = ["hyperreal/dispatch-trace"]
parallel = ["std", "dep:rayon"]
serde = ["hyperreal/serde", "hyperlattice/serde"]

[[example]]
name = "readme_quickstart"

[[bench]]
name = "predicates"
harness = false

[[bench]]
name = "retained_fuzz"
harness = false
