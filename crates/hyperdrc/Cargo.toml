[package]
name = "hyperdrc"
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
description = "Command line design readiness checks for printed circuit board Gerber files"
readme = "README.md"
repository = "https://github.com/timschmidt/hyperdrc"
categories = ["command-line-utilities", "development-tools"]
keywords = ["pcb", "drc", "dfm", "gerber", "kicad"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
anyhow = "1.0"
arrow-array = "57.3.0"
arrow-ipc = "57.3.0"
arrow-schema = "57.3.0"
clap = { version = "4.5", features = ["derive"] }
# Hyper sibling dependency switch: keep both local path and crates.io lines; do not remove either.
# Development mode uses the local path lines. For release, comment those and uncomment the crates.io lines.
csgrs = { path = "../csgrs", default-features = false, features = ["sketch", "gerber-io", "offset"] }
hyperlattice = { version = "0.6.0", path = "../hyperlattice" }
flate2 = "1.0"
geo = { version = "0.31.0", default-features = false }
hyperlimit = { path = "../hyperlimit", default-features = false, features = ["std"] }
hypercurve = { path = "../hypercurve" }
hyperpath = { path = "../hyperpath" }
hyperreal = { path = "../hyperreal" }
# csgrs = { version = "0.23.0", default-features = false, features = ["sketch", "gerber-io", "offset"] }
# hypercurve = { version = "0.3.0" }
# hyperlimit = { version = "0.4.0", default-features = false, features = ["std"] }
# hyperpath = { version = "0.3.0" }
# hyperreal = { version = "0.13.1" }
log = "0.4"
libc = "0.2"
parquet = { version = "57.3.1", default-features = false, features = ["arrow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
calamine = "0.35.0"
quick-xml = "0.39.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }

[dev-dependencies]
proptest = "1.6"

# Keep transitive sibling crates unified while using local path development mode.
[patch.crates-io]
hyperlattice = { path = "../hyperlattice" }
hyperlimit = { path = "../hyperlimit" }
hypermesh = { path = "../hypermesh" }
hyperphysics = { path = "../hyperphysics" }
hyperreal = { path = "../hyperreal" }
hypersolve = { path = "../hypersolve" }
hypertri = { path = "../hypertri" }

[[bench]]
name = "parser_geometry_smoke"
harness = false

[[bench]]
name = "fixture_smoke"
harness = false
