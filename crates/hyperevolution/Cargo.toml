[package]
name = "hyperevolution"
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
description = "Exact-aware evolutionary and proposal-search carriers for the Hyper ecosystem"
license = "Apache-2.0"
readme = "README.md"
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]
repository = "https://github.com/timschmidt/csgrs"
documentation = "https://docs.rs/hyperevolution"
keywords = ["evolution", "optimization", "search", "hyperreal", "simulation"]
categories = ["algorithms", "science", "simulation"]

[package.metadata.docs.rs]
# Document every feature-gated API.
all-features = true

[features]
default = []
dispatch-trace = ["hyperlimit/dispatch-trace", "hyperreal/dispatch-trace"]

[dependencies]
# Cargo uses this path in the workspace and retains the version requirement in
# the published manifest.
hyperlimit = { version = "0.5.0", path = "../hyperlimit", default-features = false, features = ["std"] }
hyperreal = { version = "0.14.0", path = "../hyperreal" }
[dev-dependencies]
proptest = "1.7.0"

[[bench]]
name = "fitness"
harness = false
