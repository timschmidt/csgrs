[package]
name = "hypervoxel-fuzz"
version = "0.1.0"
publish = false
edition = "2024"
readme = "README.md"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
# Local paths fuzz the complete development stack; the commented versions
# record the corresponding release coordinates.
hypervoxel = { path = "..", features = ["hypermesh-adapter", "legacy-voxelis"] }
hyperreal = { path = "../../hyperreal" }
hypermesh = { path = "../../hypermesh" }
voxelis = { path = "../voxelis" }
glam = "0.29"
# hypervoxel = "0.3.0"
# hyperreal = "0.13.0"
# hypermesh = "0.3.0"

[[bin]]
name = "grid_address"
path = "fuzz_targets/grid_address.rs"
test = false
doc = false
bench = false

[[bin]]
name = "continuous_field_materialization"
path = "fuzz_targets/continuous_field_materialization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "triangle_surface_voxelization"
path = "fuzz_targets/triangle_surface_voxelization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "triangle_solid_voxelization"
path = "fuzz_targets/triangle_solid_voxelization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hypermesh_adapter"
path = "fuzz_targets/hypermesh_adapter.rs"
test = false
doc = false
bench = false
