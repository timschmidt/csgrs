[package]
name = "hypervoxel-fuzz"
version = "0.1.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
# Hyper sibling dependency switch: keep both local path and crates.io lines; do not remove either.
# Development mode uses the local path lines. For release, comment those and uncomment the crates.io lines.
hypervoxel = { path = ".." }
hyperreal = { path = "../../hyperreal" }
# hypervoxel = "0.3.0"
# hyperreal = "0.13.0"

[[bin]]
name = "grid_address"
path = "fuzz_targets/grid_address.rs"
test = false
doc = false
bench = false

[[bin]]
name = "continuous_field_materialization"
path = "fuzz_targets/continuous_field_materialization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "triangle_surface_voxelization"
path = "fuzz_targets/triangle_surface_voxelization.rs"
test = false
doc = false
bench = false
