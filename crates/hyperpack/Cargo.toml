[package]
name = "hyperpack"
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
description = "Exact-aware packing carriers and feasibility replay for the Hyper ecosystem"
license = "Apache-2.0"
readme = "README.md"
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]
repository = "https://github.com/timschmidt/csgrs"
documentation = "https://docs.rs/hyperpack"
keywords = ["packing", "optimization", "geometry", "hyperreal", "cad"]
categories = ["algorithms", "mathematics", "science"]

[package.metadata.docs.rs]
# Document every feature-gated API.
all-features = true

[features]
default = []
dispatch-trace = ["hyperlimit/dispatch-trace", "hyperreal/dispatch-trace"]

[dependencies]
# Cargo uses these paths in the workspace and retains the version requirements
# in the published manifest.
hypercurve = { version = "0.4.0", path = "../hypercurve" }
hyperlimit = { version = "0.5.0", path = "../hyperlimit", default-features = false, features = ["std"] }
hyperreal = { version = "0.14.0", path = "../hyperreal", features = ["serde"] }

[dev-dependencies]
proptest = "1.7.0"

[[bench]]
name = "feasibility"
harness = false

[[bench]]
name = "replay_micro"
harness = false
