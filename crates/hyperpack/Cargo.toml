[package]
name = "hyperpack"
version = "0.3.0"
edition = "2024"
description = "Exact-aware packing carriers and feasibility replay for the Hyper ecosystem"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/timschmidt/hyperpack"
keywords = ["packing", "optimization", "geometry", "hyperreal", "cad"]
categories = ["algorithms", "mathematics", "science"]

[features]
default = []
dispatch-trace = ["hyperreal/dispatch-trace"]

[dependencies]
# Hyper sibling dependency switch: keep both local path and crates.io lines; do not remove either.
# Development mode uses the local path line. For release, comment it and uncomment the crates.io line.
hypercurve = { path = "../hypercurve" }
hyperreal = { path = "../hyperreal", features = ["serde"] }
# hypercurve = { version = "0.3.0" }
# hyperreal = { version = "0.13.1", features = ["serde"] }

# Keep transitive sibling crates unified while using local path development mode.
[patch.crates-io]
hyperlattice = { path = "../hyperlattice" }
hyperlimit = { path = "../hyperlimit" }
hyperreal = { path = "../hyperreal" }
hypersolve = { path = "../hypersolve" }

[dev-dependencies]
proptest = "1.7.0"

[[bench]]
name = "feasibility"
harness = false

[[bench]]
name = "replay_micro"
harness = false
