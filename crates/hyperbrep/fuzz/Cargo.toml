[package]
name = "hyperbrep-fuzz"
version = "0.1.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hyperbrep = { version = "0.2.0", path = ".." }
hypercurve = { version = "0.3.0", path = "../../hypercurve" }
hyperlimit = { version = "0.4.0", path = "../../hyperlimit" }
hyperreal = { version = "0.13.1", path = "../../hyperreal" }
hypervoxel = { version = "0.3.0", path = "../../hypervoxel" }

[patch.crates-io]
hyperreal = { path = "../../hyperreal" }
hyperlattice = { path = "../../hyperlattice" }
hyperlimit = { path = "../../hyperlimit" }
hypersolve = { path = "../../hypersolve" }

[[bin]]
name = "voxel_handoff"
path = "fuzz_targets/voxel_handoff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "planar_pcurve"
path = "fuzz_targets/planar_pcurve.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hyperreal_representations"
path = "fuzz_targets/hyperreal_representations.rs"
test = false
doc = false
bench = false
