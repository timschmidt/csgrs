[package]
name = "hyperbrep"
version = "0.2.0"
edition = "2024"
description = "Hyper-native exact boundary-representation kernel"
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/timschmidt/hyperbrep"
readme = "README.md"
keywords = ["brep", "cad", "geometry", "exact", "topology"]
categories = ["mathematics", "graphics", "data-structures"]

[features]
default = []
tessellation = ["dep:hypertri"]

[dependencies]
hypercurve = { version = "0.3.1", path = "../hypercurve" }
hyperlattice = { version = "0.6.1", path = "../hyperlattice" }
hyperlimit = { version = "0.4.1", path = "../hyperlimit" }
hyperreal = { version = "0.13.1", path = "../hyperreal", features = ["serde"] }
hypersolve = { version = "0.3.1", path = "../hypersolve" }
hypertri = { version = "0.4.1", path = "../hypertri", optional = true, features = ["earcut"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["unbounded_depth"] }
serde_stacker = "0.1.14"

[dev-dependencies]
proptest = "1.7.0"

[[bench]]
name = "kernel"
harness = false

[[bench]]
name = "work_budget"
harness = false

[[bench]]
name = "retained_parameters"
harness = false

[[bench]]
name = "retained_points"
harness = false

[[bench]]
name = "selected_topology"
harness = false

[[bench]]
name = "selected_archive"
harness = false

[[bench]]
name = "selected_solids"
harness = false

[[bench]]
name = "spline_replay_cost"
harness = false

[[bench]]
name = "archive_limits"
harness = false

[[bench]]
name = "periodic_cylinder"
harness = false

[[bench]]
name = "closed_edges"
harness = false

[[bench]]
name = "edge_images"
harness = false

[[bench]]
name = "analytic_similarity"
harness = false

[[bench]]
name = "seam_cuts"
harness = false

[[bench]]
name = "coplanar"
harness = false
