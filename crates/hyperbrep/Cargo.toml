[package]
name = "hyperbrep"
version = "0.2.0"
edition = "2024"
description = "Exact-aware boundary-representation evidence carriers for the Hyper ecosystem"
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/timschmidt/hyperbrep"
readme = "README.md"
keywords = ["brep", "cad", "geometry", "exact", "topology"]
categories = ["mathematics", "graphics", "data-structures"]

[dependencies]
# Cargo uses these paths in the workspace and retains the version requirements
# in the published manifest.
hyperlimit = { version = "0.4.0", path = "../hyperlimit" }
hypercurve = { version = "0.3.0", path = "../hypercurve" }
hyperphysics = { version = "0.3.0", path = "../hyperphysics" }
hyperreal = { version = "0.13.1", path = "../hyperreal" }
hypertri = { version = "0.4.0", path = "../hypertri", features = ["earcut"] }
hypervoxel = { version = "0.3.0", path = "../hypervoxel" }

[dev-dependencies]
criterion = "0.5"
proptest = "1.7.0"

[[bench]]
name = "shell_audit"
harness = false

[patch.crates-io]
hyperlattice = { path = "../hyperlattice" }
hyperlimit = { path = "../hyperlimit" }
hyperreal = { path = "../hyperreal" }
hypersolve = { path = "../hypersolve" }
