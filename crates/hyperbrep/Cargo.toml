[package]
name = "hyperbrep"
version = "0.2.0"
edition = "2024"
description = "Exact-aware boundary-representation evidence carriers for the Hyper ecosystem"
license = "Apache-2.0"

[dependencies]
# Hyper sibling dependency switch: keep both local path and crates.io lines; do not remove either.
# Development mode uses the local path lines. For release, comment those and uncomment the crates.io lines.
hyperlimit = { path = "../hyperlimit" }
hypercurve = { path = "../hypercurve" }
hyperphysics = { path = "../hyperphysics" }
hyperreal = { path = "../hyperreal" }
hypertri = { path = "../hypertri", features = ["earcut"] }
hypervoxel = { path = "../hypervoxel" }
# hyperlimit = { version = "0.4.0" }
# hypercurve = { version = "0.3.0" }
# hyperphysics = { version = "0.3.0" }
# hyperreal = { version = "0.13.1" }
# hypertri = { version = "0.4.0", features = ["earcut"] }
# hypervoxel = { version = "0.3.0" }

[dev-dependencies]
criterion = "0.5"
proptest = "1.7.0"

[[bench]]
name = "shell_audit"
harness = false

[patch.crates-io]
hyperlattice = { path = "../hyperlattice" }
hyperlimit = { path = "../hyperlimit" }
hyperreal = { path = "../hyperreal" }
hypersolve = { path = "../hypersolve" }
