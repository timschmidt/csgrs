name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Rust checks (${{ matrix.backend.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: default
            args: ""
          - name: all-features
            args: "--all-features"

    steps:
      - name: Check out Hyperlattice
        uses: actions/checkout@v6
        with:
          path: hyperlattice

      - name: Check out Hyperreal sibling
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/hyperreal
          path: hyperreal

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hyperlattice

      - name: Check formatting
        run: cargo fmt --check
        working-directory: hyperlattice

      - name: Check build
        run: cargo check --all-targets ${{ matrix.backend.args }}
        working-directory: hyperlattice

      - name: Run tests
        run: cargo test --all-targets ${{ matrix.backend.args }}
        working-directory: hyperlattice

      - name: Run Clippy
        run: cargo clippy --all-targets ${{ matrix.backend.args }} -- -D warnings
        working-directory: hyperlattice
