[package]
name = "hyperlattice-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Declare a standalone workspace so this crate is not included in the parent
# workspace's dependency graph during normal builds.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# Hyper sibling dependency switch: keep both local path and crates.io lines; do not remove either.
# Development mode uses the local path line. For release, comment it and uncomment the crates.io line.
hyperlattice = { path = "..", default-features = false, features = ["arbitrary"] }
# hyperlattice = { version = "0.6.0", default-features = false, features = ["arbitrary"] }

[[bin]]
name = "scalar_ops"
path = "fuzz_targets/scalar_ops.rs"
test = false
doc = false

[[bin]]
name = "complex_ops"
path = "fuzz_targets/complex_ops.rs"
test = false
doc = false

[[bin]]
name = "vector_ops"
path = "fuzz_targets/vector_ops.rs"
test = false
doc = false

[[bin]]
name = "matrix_ops"
path = "fuzz_targets/matrix_ops.rs"
test = false
doc = false
