[package]
name = "hyperlattice"
version = "0.6.0"
edition = "2024"
description = "A small Rust linear algebra library with hyperreal-backed scalar, vector, and matrix types."
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
license = "MIT"
repository = "https://github.com/timschmidt/hyperlattice"
readme = "README.md"
keywords = ["math", "blas", "matrices", "vectors", "linear-algebra"]
categories = ["mathematics"]

[dependencies]
# Hyper ecosystem dependencies: keep the crate-official release references and
# the commented workspace references below. Switch to the workspace form for
# local development, then switch back to crates.io versions before publishing.
# Hyper sibling dependency switch: keep both local path and crates.io lines; do not remove either.
# Development mode uses the local path line. For release, comment it and uncomment the crates.io line.
hyperreal = { path = "../hyperreal" }
# hyperreal = { version = "0.13.0" }
arbitrary = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.7.0"
proptest = "1.7.0"
serde_json = "1.0.145"
symbolica = "1.5.0"

[features]
default = []
hyperreal-dispatch-trace = ["hyperreal/dispatch-trace"]
arbitrary = ["dep:arbitrary"]

[[bench]]
name = "mathbench"
harness = false

[[bench]]
name = "regression_sentinels"
harness = false
