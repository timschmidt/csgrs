[package]
name = "hypersdf"
version = "0.2.0"
edition = "2024"
rust-version = "1.95.0"
description = "Exact-aware signed-distance and implicit-field carriers for the Hyper stack"
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/timschmidt/csgrs"
documentation = "https://docs.rs/hypersdf"
readme = "README.md"
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]
keywords = ["sdf", "implicit", "geometry", "exact", "voxel"]
categories = ["mathematics", "graphics", "algorithms"]

[package.metadata.docs.rs]
# Document every feature-gated API.
all-features = true

[dependencies]
fast-surface-nets = "0.2.1"
# Cargo uses these paths in the workspace and retains the version requirements
# in the published manifest.
hyperlattice = { version = "0.7.0", path = "../hyperlattice" }
hyperlimit = { version = "0.5.0", path = "../hyperlimit" }
hyperreal = { version = "0.14.0", path = "../hyperreal" }
hypervoxel = { version = "0.3.0", path = "../hypervoxel", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.7.0"

[[bench]]
name = "classification"
harness = false

[features]
default = []
dispatch-trace = ["hyperlimit/dispatch-trace", "hyperreal/dispatch-trace"]
hypervoxel-adapter = ["dep:hypervoxel"]
