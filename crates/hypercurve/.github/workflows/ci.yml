name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test, and WASM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: hypercurve
          persist-credentials: false

      - name: Check out patched hyperreal sibling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/hyperreal
          path: hyperreal
          persist-credentials: false

      - name: Check out patched hyperlattice sibling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/hyperlattice
          path: hyperlattice
          persist-credentials: false

      - name: Check out patched hyperlimit sibling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/hyperlimit
          path: hyperlimit
          persist-credentials: false

      - name: Check out patched hypersolve sibling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/hypersolve
          path: hypersolve
          persist-credentials: false

      - name: Check out patched hypertri sibling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/hypertri
          path: hypertri
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy --component rustfmt \
            --target wasm32-unknown-unknown
          rustup default stable

      - name: Cache Cargo build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            hypercurve -> hypercurve/target
            hypercurve/examples/hypercurve_ui -> hypercurve/examples/hypercurve_ui/target

      - name: Check formatting
        working-directory: hypercurve
        run: cargo fmt --all --check

      - name: Run strict Clippy
        working-directory: hypercurve
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run bounded test suite
        working-directory: hypercurve
        # Exact algebraic tests can each retain large certified elimination
        # structures. Explicitly ignored manual certification stress cases
        # remain available by name; keep the push suite optimized and bound
        # concurrent test workers below the public runner's four-CPU ceiling.
        run: cargo test --release --locked --all-features --no-fail-fast -- --test-threads=3

      - name: Test WASM demo crate
        working-directory: hypercurve/examples/hypercurve_ui
        run: cargo test --locked --no-fail-fast

      - name: Run strict demo Clippy
        working-directory: hypercurve/examples/hypercurve_ui
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release WASM demo
        working-directory: hypercurve/examples/hypercurve_ui
        run: cargo build --locked --release --target wasm32-unknown-unknown
