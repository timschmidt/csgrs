[package]
name = "hypercurve-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hypercurve = { path = "..", features = ["svg"] }
hyperreal = { path = "../../hyperreal" }

