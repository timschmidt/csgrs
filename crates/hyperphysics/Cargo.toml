[package]
name = "hyperphysics"
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
description = "Hyperreal-backed physical simulation primitives"
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/timschmidt/csgrs"
documentation = "https://docs.rs/hyperphysics"
readme = "README.md"
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]
keywords = ["physics", "simulation", "hyperreal", "dynamics"]
categories = ["science", "simulation", "mathematics"]

[package.metadata.docs.rs]
# Document every feature-gated API.
all-features = true

[features]
default = []
certified-flow = ["dep:hyperdynamics", "hyperdynamics/field"]
dispatch-trace = [
    "hyperreal/dispatch-trace",
    "hyperlattice/hyperreal-dispatch-trace",
    "hyperlimit/dispatch-trace",
    "hypermesh/dispatch-trace",
]

[dependencies]
hyperdynamics = { version = "0.1.0", path = "../hyperdynamics", default-features = false, optional = true }
# Cargo uses these paths in the workspace and retains the version requirements
# in the published manifest.
hyperlattice = { version = "0.7.0", path = "../hyperlattice" }
hyperlimit = { version = "0.5.0", path = "../hyperlimit" }
hypermesh = { version = "0.1.0", path = "../hypermesh" }
hyperreal = { version = "0.14.0", path = "../hyperreal" }
hypersolve = { version = "0.4.0", path = "../hypersolve" }

[dev-dependencies]
hyperinterval = { version = "0.1.0", path = "../hyperinterval", default-features = false, features = ["dyadic"] }
hyperlattice-interval = { version = "0.1.0", path = "../hyperlattice-interval", default-features = false, features = ["dyadic"] }
proptest = "1.7.0"

[[bench]]
name = "mass_properties"
harness = false

[[bench]]
name = "certified_flow"
harness = false
required-features = ["certified-flow"]
