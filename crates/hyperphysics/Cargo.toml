[package]
name = "hyperphysics"
version = "0.3.0"
edition = "2024"
description = "Hyperreal-backed physical simulation primitives"
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/timschmidt/hyperphysics"
readme = "README.md"
keywords = ["physics", "simulation", "hyperreal", "dynamics"]
categories = ["science", "simulation", "mathematics"]

[features]
default = []
dispatch-trace = [
    "hyperreal/dispatch-trace",
    "hyperlattice/hyperreal-dispatch-trace",
    "hyperlimit/dispatch-trace",
    "hypermesh/dispatch-trace",
]

[dependencies]
# Cargo uses these paths in the workspace and retains the version requirements
# in the published manifest.
hyperlattice = { version = "0.6.1", path = "../hyperlattice" }
hyperlimit = { version = "0.4.1", path = "../hyperlimit" }
hypermesh = { version = "0.1.0", path = "../hypermesh" }
hyperreal = { version = "0.13.1", path = "../hyperreal" }
hypersolve = { version = "0.3.1", path = "../hypersolve" }

# Keep transitive sibling crates unified while using local path development mode.
[patch.crates-io]
hyperlattice = { path = "../hyperlattice" }
hyperlimit = { path = "../hyperlimit" }
hyperreal = { path = "../hyperreal" }

[dev-dependencies]
proptest = "1.7.0"

[[bench]]
name = "mass_properties"
harness = false
