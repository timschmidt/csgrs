[package]
name = "hypersolve"
version = "0.4.0"
edition = "2024"
rust-version = "1.95.0"
description = "Hyperreal-backed nonlinear solving and constraint evaluation"
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/timschmidt/csgrs"
documentation = "https://docs.rs/hypersolve"
readme = "README.md"
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]
keywords = ["solver", "constraints", "hyperreal", "numerics", "cad"]
categories = ["mathematics", "science", "algorithms"]

[package.metadata.docs.rs]
# Document every feature-gated API.
all-features = true

[dependencies]
# Cargo uses these paths in the workspace and retains the version requirements
# in the published manifest.
hyperreal = { version = "0.14.0", path = "../hyperreal", default-features = false }
hyperlattice = { version = "0.7.0", path = "../hyperlattice", default-features = false }
hyperlimit = { version = "0.5.0", path = "../hyperlimit", default-features = false }
num = { version = "0.4.3", features = ["num-bigint"] }
serde = { version = "1.0", features = ["derive"], optional = true }
hyperinterval = { version = "0.1.0", path = "../hyperinterval", default-features = false, optional = true }
[dev-dependencies]
# Test-only interval migration candidates; production remains gated by cost.
hyperinterval = { version = "0.1.0", path = "../hyperinterval", default-features = false, features = ["rational"] }
# Fresh-process selected-field replay exercises validated exact scalar interchange.
hyperreal = { version = "0.14.0", path = "../hyperreal", default-features = false, features = ["serde"] }
criterion = "0.5"
# Competitive floating-point controls only. Production solving and proof
# replay remain independent of these external numerical engines.
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
proptest = "1.7.0"
roots = "0.0.8"
serde_json = "1.0.149"

[features]
default = []
# Owned expression graphs; validated dynamics integration remains experimental.
expression-program = []
coordinate-program = ["expression-program"]
taylor-model = ["interval-program"]
taylor-affine = ["taylor-model"]
float-proposal-program = ["expression-program"]
interval-program = ["expression-program", "dep:hyperinterval", "hyperinterval/hyperreal"]
serde = ["dep:serde", "hyperreal/serde", "hyperinterval?/serde"]
dispatch-trace = [
    "hyperreal/dispatch-trace",
    "hyperlattice/hyperreal-dispatch-trace",
    "hyperlimit/dispatch-trace",
]

[[bench]]
name = "certification"
harness = false

[[bench]]
name = "dispatch_trace"
harness = false
required-features = ["dispatch-trace"]

[[bench]]
name = "algebraic_fiber"
harness = false

[[bench]]
name = "representations"
harness = false

[[bench]]
name = "competitive"
harness = false

[[bench]]
name = "retained_fuzz"
harness = false

[[example]]
name = "allocation_profile"

[[example]]
name = "owned_program"
required-features = ["expression-program"]

[[example]]
name = "enclosed_program"
required-features = ["interval-program"]

[[bench]]
name = "expression_program"
harness = false
required-features = ["expression-program"]
