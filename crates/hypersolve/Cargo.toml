[package]
name = "hypersolve"
version = "0.3.1"
edition = "2024"
description = "Hyperreal-backed nonlinear solving and constraint evaluation"
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/timschmidt/hypersolve"
readme = "README.md"
keywords = ["solver", "constraints", "hyperreal", "numerics", "cad"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
# Cargo uses these paths in the workspace and retains the version requirements
# in the published manifest.
hyperreal = { version = "0.13.1", path = "../hyperreal", default-features = false }
hyperlattice = { version = "0.6.1", path = "../hyperlattice", default-features = false }
hyperlimit = { version = "0.4.1", path = "../hyperlimit", default-features = false }
num = { version = "0.4.3", features = ["num-bigint"] }
[dev-dependencies]
criterion = "0.5"
proptest = "1.7.0"

[features]
default = []
dispatch-trace = [
    "hyperreal/dispatch-trace",
    "hyperlattice/hyperreal-dispatch-trace",
    "hyperlimit/dispatch-trace",
]

[[bench]]
name = "certification"
harness = false

[[bench]]
name = "dispatch_trace"
harness = false
required-features = ["dispatch-trace"]
