[package]
name = "hyperdynamics"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Owned exact vector fields and validated-computation adapters for the Hyper stack"
license = "MIT OR Apache-2.0"
repository = "https://github.com/timschmidt/csgrs"
readme = "README.md"
include = ["/src/**", "/examples/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]
categories = ["mathematics", "science"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
coordinates = ["field", "hypersolve/coordinate-program"]
qr-evolution = ["qr-coordinates", "reachability", "taylor-evolution"]
qr-coordinates = ["coordinate-transition", "hypersolve/qr-coordinates"]
coordinate-transition = ["coordinates", "hypersolve/coordinate-transition"]
taylor-model = ["field", "hypersolve/taylor-model"]
taylor-flow = ["taylor-model"]
taylor-evolution = ["taylor-flow"]
adaptive-taylor = ["taylor-flow"]
taylor-affine = ["taylor-model", "hypersolve/taylor-affine"]
taylor-noise = ["taylor-affine", "hypersolve/taylor-noise"]
taylor-polynomial = ["taylor-model", "hypersolve/taylor-polynomial"]
reachability = ["field"]
rk-proposal = ["field", "hypersolve/float-proposal-program", "hyperinterval/float-proposal"]
field = ["dep:hyperreal", "dep:hyperinterval", "dep:hyperlattice-interval", "dep:hypersolve", "hypersolve/interval-program"]
serde = ["dep:serde", "hypersolve?/serde", "hyperlattice-interval?/serde"]
dispatch-trace = ["hypersolve?/dispatch-trace", "hyperinterval?/dispatch-trace"]

[dependencies]
hyperreal = { version = "0.14.0", path = "../hyperreal", default-features = false, optional = true }
hypersolve = { version = "0.4.0", path = "../hypersolve", default-features = false, optional = true }
hyperinterval = { version = "0.1.0", path = "../hyperinterval", default-features = false, features = ["hyperreal"], optional = true }
hyperlattice-interval = { version = "0.1.0", path = "../hyperlattice-interval", default-features = false, features = ["dyadic"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.5"
hyperreal = { version = "0.14.0", path = "../hyperreal", default-features = false }
serde_json = "1.0"

[[example]]
name = "expression_field"
required-features = ["field"]

[[example]]
name = "rk_proposal"
required-features = ["rk-proposal"]

[[example]]
name = "reachability"
required-features = ["reachability"]

[[example]]
name = "taylor_model"
required-features = ["taylor-model"]

[[example]]
name = "taylor_affine"
required-features = ["taylor-affine"]

[[example]]
name = "coordinates"
required-features = ["coordinates"]

[[bench]]
name = "taylor_flow"
harness = false
required-features = ["taylor-flow"]

[[bench]]
name = "coordinate_transition"
harness = false
required-features = ["coordinate-transition"]

[[bench]]
name = "qr_coordinates"
harness = false
required-features = ["qr-coordinates"]

[[bench]]
name = "taylor_evolution"
harness = false
required-features = ["taylor-evolution", "reachability"]

[[bench]]
name = "adaptive_taylor"
harness = false
required-features = ["adaptive-taylor", "taylor-evolution"]

[[bench]]
name = "qr_evolution"
harness = false
required-features = ["qr-evolution"]

[[example]]
name = "taylor_noise"
required-features = ["taylor-noise"]

[[example]]
name = "taylor_orders"
required-features = ["taylor-flow"]

[[bench]]
name = "taylor_orders"
harness = false
required-features = ["taylor-flow"]
