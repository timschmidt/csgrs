[package]
name = "csgrs-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "C ABI for csgrs scalar adapters"
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
license = "MIT"
repository = "https://github.com/timschmidt/csgrs-ffi"
readme = "README.md"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
csgrs = { version = "0.23.0", path = "../csgrs", default-features = false, features = ["curve"] }
hyperlattice = { version = "0.6.1", path = "../hyperlattice" }
hyperreal = { version = "0.13.1", path = "../hyperreal", default-features = false }

[patch.crates-io]
hyperlattice = { path = "../hyperlattice" }
hyperlimit = { path = "../hyperlimit" }
hyperreal = { path = "../hyperreal" }
hypertri = { path = "../hypertri" }
hypersolve = { path = "../hypersolve" }
