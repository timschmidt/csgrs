[package]
name = "csgrs-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "C ABI for csgrs scalar adapters"
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
license = "MIT"
repository = "https://github.com/timschmidt/csgrs"
documentation = "https://docs.rs/csgrs-ffi"
readme = "README.md"
include = ["/src/**", "/include/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
csgrs = { version = "0.23.0", path = "../..", default-features = false, features = ["curve"] }
hyperlattice = { version = "0.7.0", path = "../hyperlattice" }
hyperreal = { version = "0.14.0", path = "../hyperreal", default-features = false }
