name: Rust CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: csgrs-ffi
          persist-credentials: false

      - name: Fetch pinned geometry crates
        shell: bash
        run: |
          set -euo pipefail

          checkout_repo() {
            local name="$1"
            local url="$2"
            local revision="$3"
            local destination="${GITHUB_WORKSPACE}/${name}"

            git init "${destination}"
            git -C "${destination}" remote add origin "${url}"
            git -C "${destination}" fetch --depth 1 origin "${revision}"
            git -C "${destination}" checkout --detach FETCH_HEAD
          }

          checkout_repo csgrs https://github.com/timschmidt/csgrs.git 61703bc3161e822f4120d3fb41edea9f174484c8
          checkout_repo hypercurve https://github.com/timschmidt/hypercurve.git 9c79febdd0618081ed8b5fa6f8b108de8957b8d3
          checkout_repo hyperlattice https://github.com/timschmidt/hyperlattice.git ac2aaebeaf676f837b28ed103a4391f473bd7786
          checkout_repo hyperlimit https://github.com/timschmidt/liminal.git 838887426941ff5af2060aacd03597929519207f
          checkout_repo hypermesh https://github.com/timschmidt/hypermesh.git 92effa8df5d0640a66af99a7145d722b0acd78ed
          checkout_repo hyperphysics https://github.com/timschmidt/hyperphysics.git 86f84d0e470fe68bdec66459595a63cb1d8c8d7f
          checkout_repo hyperreal https://github.com/timschmidt/hyperreal.git 6f8ce9a7e600b8f32acf8313d5be6c1972c207bc
          checkout_repo hypersdf https://github.com/timschmidt/hypersdf.git ecb9811f99fdca083faae8e97624679c8ce1970c
          checkout_repo hypersolve https://github.com/timschmidt/hypersolve.git 2ec9cd754e519197dc558a2b77f12dc43265064c
          checkout_repo hypertri https://github.com/timschmidt/hypertriangulate.git 2f9b27222e2108ceffe7e2a9cf669c3c3e63a5e0

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: csgrs-ffi -> target

      - name: Check
        working-directory: csgrs-ffi
        run: cargo check --locked
      - name: Test
        working-directory: csgrs-ffi
        run: cargo test --locked
      - name: Formatting
        working-directory: csgrs-ffi
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: csgrs-ffi
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Documentation
        working-directory: csgrs-ffi
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: C header syntax
        working-directory: csgrs-ffi
        run: |
          cc -std=c11 -fsyntax-only -x c include/csgrs.h
          c++ -std=c++17 -fsyntax-only -x c++ include/csgrs.h
