name: Rust CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: csgrs-ffi
          persist-credentials: false

      - name: Fetch pinned geometry crates
        shell: bash
        run: |
          set -euo pipefail

          checkout_repo() {
            local name="$1"
            local url="$2"
            local revision="$3"
            local destination="${GITHUB_WORKSPACE}/${name}"

            git init "${destination}"
            git -C "${destination}" remote add origin "${url}"
            git -C "${destination}" fetch --depth 1 origin "${revision}"
            git -C "${destination}" checkout --detach FETCH_HEAD
          }

          checkout_repo csgrs https://github.com/timschmidt/csgrs.git 3e7c02d02362f7f88faffab79d29b4254f144d5a
          checkout_repo hypercurve https://github.com/timschmidt/hypercurve.git 9bc35363e2de0ee57e53571bc20d960bfa6c0fc4
          checkout_repo hyperlattice https://github.com/timschmidt/hyperlattice.git 91d300239500116efbef0fe9da9e1b564d37adfb
          checkout_repo hyperlimit https://github.com/timschmidt/hyperlimit.git 681096cabf9ab310b8b111b7438217446b536890
          checkout_repo hypermesh https://github.com/timschmidt/hypermesh.git 1314d54714fd64c1e3e5512c0b5571e831d13898
          checkout_repo hyperphysics https://github.com/timschmidt/hyperphysics.git a8002f286914356d3ebc5f491695f39f6f1c029e
          checkout_repo hyperreal https://github.com/timschmidt/hyperreal.git 4ebfa43f8b48d512a18ffaf3a2690cedea74cd96
          checkout_repo hypersdf https://github.com/timschmidt/hypersdf.git 6b454d118c98e9afd3cce12a7700caa4d84633a6
          checkout_repo hypersolve https://github.com/timschmidt/hypersolve.git 00a3c4704dd4be973f5e9b90891073334f717ce5
          checkout_repo hypertri https://github.com/timschmidt/hypertri.git 67d106bd77042555ff38ab4413ebb035bc9bc6a9

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: csgrs-ffi -> target

      - name: Check
        working-directory: csgrs-ffi
        run: cargo check --locked
      - name: Test
        working-directory: csgrs-ffi
        run: cargo test --locked
      - name: Formatting
        working-directory: csgrs-ffi
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: csgrs-ffi
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Documentation
        working-directory: csgrs-ffi
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: C header syntax
        working-directory: csgrs-ffi
        run: |
          cc -std=c11 -fsyntax-only -x c include/csgrs.h
          c++ -std=c++17 -fsyntax-only -x c++ include/csgrs.h
