<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>hypercurve UI</title>
    
<script type="module">
import init, * as bindings from '/hypercurve/hypercurve_ui.js';
const wasm = await init({ module_or_path: '/hypercurve/hypercurve_ui_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <base href="/hypercurve/">
    <style>
        html {
            touch-action: manipulation;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #24272d;
        }
        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading_text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d8dee9;
            font-family: system-ui, sans-serif;
        }
    </style>
<link rel="modulepreload" href="/hypercurve/hypercurve_ui.js" crossorigin="anonymous" integrity="sha384-zS8B4CMqh+Og++c68rxmjpcRe0VReZeUltfIF8XQjChI0QE/cCn37+Xm6IX1t8V2"><link rel="preload" href="/hypercurve/hypercurve_ui_bg.wasm" crossorigin="anonymous" integrity="sha384-pTfFTXSLN389MhNhvCGrCgTCpSOQ7kG1Di9dXdFSPO0LrayUapT2CaIQ+19eT4ga" as="fetch" type="application/wasm"></head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <div id="loading_text">Loading hypercurve UI...</div>
</body>
</html>
