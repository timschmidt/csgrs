name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Rust checks (${{ matrix.backend.name }})
    runs-on: ubuntu-latest
    env:
      CARGO_ARGS: ${{ matrix.backend.args }}
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: default
            args: ""
          - name: all-features
            args: "--all-features"

    steps:
      - name: Check out Hyperlattice
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: hyperlattice
          persist-credentials: false

      - name: Check out Hyperreal sibling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/hyperreal
          path: hyperreal
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hyperlattice

      - name: Check formatting
        run: cargo fmt --check
        working-directory: hyperlattice

      - name: Check build
        run: cargo check --all-targets ${CARGO_ARGS}
        working-directory: hyperlattice

      - name: Run tests
        run: cargo test --all-targets ${CARGO_ARGS}
        working-directory: hyperlattice

      - name: Run Clippy
        run: cargo clippy --all-targets ${CARGO_ARGS} -- -D warnings
        working-directory: hyperlattice

      - name: Check fuzz targets
        if: matrix.backend.name == 'default'
        run: cargo check --manifest-path fuzz/Cargo.toml --bins
        working-directory: hyperlattice
