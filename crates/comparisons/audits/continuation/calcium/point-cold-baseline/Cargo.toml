[package]
name = "calcium-point-cold-baseline"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
hyperreal = { path = "../e-plan-qualified-candidate/hyperreal", features = ["serde"] }
hyperlimit = { path = "../e-plan-qualified-candidate/hyperlimit" }
hypersolve = { path = "../e-plan-qualified-candidate/hypersolve" }
serde_json = "1.0"

[[bin]]
name = "point-cold-baseline"
path = "../point-cold-native.rs"

[lib]
name = "point_cold_baseline"
path = "../point-cold-platform.rs"
crate-type = ["cdylib"]
