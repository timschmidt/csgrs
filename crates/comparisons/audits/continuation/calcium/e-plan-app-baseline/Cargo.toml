[package]
name = "calcium-e-plan-baseline"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
hyperreal = { path = "../derivative-demand-candidate/hyperreal", features = ["serde"] }
num = "0.4.3"
rug = { version = "1.30.0", default-features = false, features = ["integer", "float", "std"] }
serde_json = "1.0.149"
[[bin]]
name = "e-plan-baseline-check"
path = "../e-plan-check.rs"
[[bin]]
name = "e-plan-baseline-cpu"
path = "../e-plan-cpu.rs"
[[bin]]
name = "e-plan-baseline-allocation"
path = "../e-plan-allocation.rs"
