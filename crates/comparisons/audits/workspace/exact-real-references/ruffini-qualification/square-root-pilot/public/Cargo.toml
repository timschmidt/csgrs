[package]
name = "ruffini_hyper_square_root_public"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "ruffini_hyper_square_root_public"
path = "main.rs"

[dependencies]
hyperreal = { path = "../snapshot/hyperreal", default-features = false }
hyperlimit = { path = "../snapshot/hyperlimit", default-features = false }
baseline-solve = { package = "hypersolve", path = "../snapshot/hypersolve", optional = true }
diagonal-solve = { package = "hypersolve-diagonal-pilot", path = "../hypersolve-diagonal", optional = true }
num = "0.4.3"

[features]
default = ["baseline"]
baseline = ["dep:baseline-solve"]
diagonal = ["dep:diagonal-solve"]

[workspace]
