[package]
name = "hyperparts"
version = "0.3.0"
edition = "2024"
description = "Source-attributed part knowledge graph carriers for the Hyper ecosystem"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/timschmidt/hyperparts"
keywords = ["parts", "bom", "knowledge-graph", "hyperreal", "cad"]
categories = ["data-structures", "science", "development-tools"]

[dependencies]
# Hyper ecosystem dependencies: keep the crate-official release references and
# the commented workspace references below. Switch to the workspace form for
# local development, then switch back to crates.io versions before publishing.
# Hyper sibling dependency switch: keep both local path and crates.io lines; do not remove either.
# Development mode uses the local path line. For release, comment it and uncomment the crates.io line.
hyperreal = { path = "../hyperreal" }
# hyperreal = { version = "0.13.1" }
[dev-dependencies]
proptest = "1.7.0"

[[bench]]
name = "queries"
harness = false
