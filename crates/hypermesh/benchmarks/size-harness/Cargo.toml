[package]
name = "hypermesh-size-harness"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "hypermesh-size-harness"

[dependencies]
hypermesh = { path = "../..", default-features = false }

[features]
default = []
hypermesh-all = [
    "hypermesh/dispatch-trace",
    "hypermesh/fuzz-bounded-campaign",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.size]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = "symbols"
