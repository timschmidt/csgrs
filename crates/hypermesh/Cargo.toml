[package]
name = "hypermesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Hyperreal-backed exact mesh boolean primitives for Rust."
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
license = "MIT"
repository = "https://github.com/timschmidt/csgrs"
documentation = "https://docs.rs/hypermesh"
readme = "README.md"
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]
keywords = ["mesh", "boolean", "geometry", "exact", "csg"]
categories = ["mathematics", "graphics", "algorithms"]

[package.metadata.docs.rs]
# Document every feature-gated API.
all-features = true

[dependencies]
hyperlattice = { version = "0.7.0", path = "../hyperlattice" }
hyperreal = { version = "0.14.0", path = "../hyperreal" }
hyperlimit = { version = "0.5.0", path = "../hyperlimit", default-features = false, features = ["std"] }
hypertri = { version = "0.5.0", path = "../hypertri", default-features = false, features = ["earcut", "cdt"] }

[dev-dependencies]
boolmesh = "=0.1.9"
criterion = "0.5"
manifold-rust = "=0.9.2"
proptest = "1.7.0"
three-d-asset = "=0.4.0"
toml = "=0.8.23"
tri-mesh = "=0.6.1"

[features]
default = []
fuzz-bounded-campaign = []
dispatch-trace = [
    "hyperreal/dispatch-trace",
    "hyperlattice/hyperreal-dispatch-trace",
    "hyperlimit/dispatch-trace",
]

[[bench]]
name = "end_to_end"
harness = false

[[bench]]
name = "dispatch_trace"
harness = false
required-features = ["dispatch-trace"]

[[bench]]
name = "competitive"
harness = false
