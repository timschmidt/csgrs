name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-exact
            command: cargo test
          - name: no-default-features
            command: cargo check --no-default-features
          - name: all-features
            command: cargo test --all-features
          - name: all-features-clippy
            command: cargo clippy --all-features -- -D warnings
          - name: all-features-docs
            command: cargo doc --all-features --no-deps
          - name: benches
            command: cargo bench --no-run
          - name: fuzz-targets
            command: cargo check --manifest-path fuzz/Cargo.toml --bins
          - name: size-harness-native
            command: cargo build --locked --manifest-path benchmarks/size-harness/Cargo.toml --profile size

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: hypermesh
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: timschmidt/hyperreal
          path: hyperreal
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: timschmidt/hyperlattice
          path: hyperlattice
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: timschmidt/hyperlimit
          path: hyperlimit
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: timschmidt/hypertri
          path: hypertri
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hypermesh
      - name: Run matrix command
        env:
          COMMAND: ${{ matrix.command }}
        run: $COMMAND
        working-directory: hypermesh

  demo:
    name: demo-wasm
    runs-on: ubuntu-latest
    env:
      TRUNK_COLOR: never

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: hypermesh
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: timschmidt/hypergraphics
          path: hypergraphics
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: timschmidt/hyperreal
          path: hyperreal
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: timschmidt/hyperlattice
          path: hyperlattice
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: timschmidt/hyperlimit
          path: hyperlimit
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: timschmidt/hypertri
          path: hypertri
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hypermesh/examples/hypermesh_ui
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: trunk@0.21.14
      - run: cargo build --locked --manifest-path benchmarks/size-harness/Cargo.toml --profile size --target wasm32-unknown-unknown
        working-directory: hypermesh
      - run: trunk build --release --locked
        working-directory: hypermesh/examples/hypermesh_ui
