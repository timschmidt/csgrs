[package]
name = "hypermesh-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
hypermesh = { path = "..", features = ["fuzz-bounded-campaign"] }
hyperlattice = { path = "../../hyperlattice" }
hyperreal = { path = "../../hyperreal" }

[[bin]]
name = "polygon_predicates"
path = "fuzz_targets/polygon_predicates.rs"
test = false
doc = false

[[bin]]
name = "bvh_queries"
path = "fuzz_targets/bvh_queries.rs"
test = false
doc = false

[[bin]]
name = "mesh_and_hull"
path = "fuzz_targets/mesh_and_hull.rs"
test = false
doc = false

[[bin]]
name = "boolean_pipeline"
path = "fuzz_targets/boolean_pipeline.rs"
test = false
doc = false

[[bin]]
name = "boolean_box_oracle"
path = "fuzz_targets/boolean_box_oracle.rs"
test = false
doc = false

[[bin]]
name = "boolean_input_validation"
path = "fuzz_targets/boolean_input_validation.rs"
test = false
doc = false

[[bin]]
name = "boolean_hyperreal_representations"
path = "fuzz_targets/boolean_hyperreal_representations.rs"
test = false
doc = false

[[bin]]
name = "boolean_transformations"
path = "fuzz_targets/boolean_transformations.rs"
test = false
doc = false
