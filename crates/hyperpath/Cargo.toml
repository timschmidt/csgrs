[package]
name = "hyperpath"
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
description = "Exact-aware path predicates and route constraints for the Hyper ecosystem"
authors = ["Timothy Schmidt <timschmidt@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/timschmidt/csgrs"
documentation = "https://docs.rs/hyperpath"
readme = "README.md"
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]
keywords = ["paths", "routing", "constraints", "hyperreal", "cad"]
categories = ["algorithms", "mathematics", "science"]

[package.metadata.docs.rs]
# Document every feature-gated API.
all-features = true

[features]
default = []
dispatch-trace = ["hyperlimit/dispatch-trace", "hyperreal/dispatch-trace"]

[dependencies]
# Cargo uses these paths in the workspace and retains the version requirements
# in the published manifest.
hyperlimit = { version = "0.5.0", path = "../hyperlimit", default-features = false }
hyperreal = { version = "0.14.0", path = "../hyperreal", default-features = false }
hypersolve = { version = "0.4.0", path = "../hypersolve", default-features = false }
[dev-dependencies]
criterion = "0.5"
proptest = "1.7.0"

[[bench]]
name = "path_predicates"
harness = false
