[package]
name = "csgrs-fuzz"
version = "0.1.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
csgrs = { version = "0.23.0", path = "..", features = ["offset", "svg-io"] }
hypercurve = { version = "0.3.1", path = "../../hypercurve" }
hyperlimit = { version = "0.4.1", path = "../../hyperlimit" }
hyperlattice = { version = "0.6.1", path = "../../hyperlattice" }
hypersdf = { version = "0.2.0", path = "../../hypersdf" }
libfuzzer-sys = "0.4"
hashbrown = "0.15"

[[bin]]
name = "fuzz_mesh_bytecode"
